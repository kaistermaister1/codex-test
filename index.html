<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Singularity</title>
  <style>
    :root {
      --bg: #04030a;
      --fg: #e8f4ff;
      --accent: #75f6ff;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 30% 10%, #130b2c 0%, #05030d 48%, #030208 100%);
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--fg);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      filter: saturate(1.2) contrast(1.05);
    }

    .hud {
      position: fixed;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .title {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      font-size: clamp(0.85rem, 1vw, 1rem);
      opacity: 0.85;
    }

    .sub {
      font-size: clamp(0.75rem, 0.9vw, 0.95rem);
      opacity: 0.6;
      margin-top: 0.3rem;
      max-width: 34rem;
      line-height: 1.35;
    }

    .stats {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 0.84rem;
      line-height: 1.35;
      opacity: 0.75;
    }

    .pulse {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(117, 246, 255, 0.2);
      background: rgba(7, 13, 32, 0.45);
      backdrop-filter: blur(10px);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0.8;
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.04); }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud">
    <div>
      <div class="title">Neon Singularity</div>
      <div class="sub">Move your cursor: reality bends around your gravity well. Click to trigger a chrono-burst.</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="pulse">Interactive generative cosmos • 60 FPS target</div>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d', { alpha: true });
    const statsEl = document.getElementById('stats');

    const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
    const mouse = { x: 0, y: 0, active: false, burst: 0 };
    const stars = [];
    const trails = [];
    let w = 0, h = 0, t = 0, fps = 60;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      const dpr = DPR();
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function seed() {
      const count = Math.floor((w * h) / 4800);
      stars.length = 0;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.pow(Math.random(), 0.65) * Math.min(w, h) * 0.45;
        stars.push({
          x: w * 0.5 + Math.cos(angle) * radius,
          y: h * 0.5 + Math.sin(angle) * radius,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          z: Math.random(),
          hue: 180 + Math.random() * 120,
          phase: Math.random() * 100,
        });
      }
    }

    function arcField(cx, cy, intensity, color) {
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, intensity);
      grad.addColorStop(0, color.replace('ALPHA', '0.35'));
      grad.addColorStop(0.5, color.replace('ALPHA', '0.12'));
      grad.addColorStop(1, color.replace('ALPHA', '0'));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, intensity, 0, Math.PI * 2);
      ctx.fill();
    }

    function step(dt) {
      t += dt;
      mouse.burst *= 0.94;
      const centerX = w * 0.5 + Math.cos(t * 0.00035) * 18;
      const centerY = h * 0.5 + Math.sin(t * 0.00042) * 12;

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(2, 3, 8, 0.22)';
      ctx.fillRect(0, 0, w, h);

      arcField(centerX, centerY, Math.min(w, h) * 0.33, 'rgba(130, 120, 255, ALPHA)');
      arcField(centerX, centerY, Math.min(w, h) * 0.18 + mouse.burst * 80, 'rgba(117, 246, 255, ALPHA)');

      ctx.globalCompositeOperation = 'lighter';

      for (const s of stars) {
        const dx = centerX - s.x;
        const dy = centerY - s.y;
        const dist2 = dx * dx + dy * dy + 60;
        const grav = 50 / dist2;

        s.vx += dx * grav * 0.18;
        s.vy += dy * grav * 0.18;

        if (mouse.active) {
          const mx = mouse.x - s.x;
          const my = mouse.y - s.y;
          const md2 = mx * mx + my * my + 80;
          const pull = (120 + mouse.burst * 35) / md2;
          s.vx += mx * pull;
          s.vy += my * pull;
        }

        const swirl = Math.sin((s.phase + t * 0.0012) * (0.8 + s.z)) * 0.012;
        s.vx += -dy * swirl * 0.01;
        s.vy += dx * swirl * 0.01;

        s.vx *= 0.985;
        s.vy *= 0.985;
        s.x += s.vx;
        s.y += s.vy;

        if (s.x < -50 || s.x > w + 50 || s.y < -50 || s.y > h + 50) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.min(w, h) * (0.45 + Math.random() * 0.25);
          s.x = centerX + Math.cos(angle) * radius;
          s.y = centerY + Math.sin(angle) * radius;
          s.vx = (Math.random() - 0.5) * 1.3;
          s.vy = (Math.random() - 0.5) * 1.3;
        }

        const twinkle = 0.4 + 0.6 * Math.sin(t * 0.002 + s.phase);
        const size = 0.7 + s.z * 1.8 + twinkle * 0.65;

        trails.push({ x: s.x, y: s.y, life: 20 + s.z * 18, hue: s.hue, size: size * 0.8 });

        ctx.fillStyle = `hsla(${s.hue}, 95%, ${60 + s.z * 20}%, ${0.28 + s.z * 0.45})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = trails.length - 1; i >= 0; i--) {
        const tr = trails[i];
        tr.life -= 1;
        if (tr.life <= 0) {
          trails.splice(i, 1);
          continue;
        }
        const alpha = tr.life / 32;
        ctx.fillStyle = `hsla(${tr.hue}, 95%, 70%, ${alpha * 0.15})`;
        ctx.beginPath();
        ctx.arc(tr.x, tr.y, tr.size * (0.9 + alpha * 0.8), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'screen';
      const ringR = Math.min(w, h) * (0.14 + 0.04 * Math.sin(t * 0.0013)) + mouse.burst * 22;
      ctx.strokeStyle = 'rgba(150, 220, 255, 0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(centerX, centerY, ringR, 0, Math.PI * 2);
      ctx.stroke();

      statsEl.innerHTML = [
        `entities: ${stars.length.toLocaleString()}`,
        `trails: ${trails.length.toLocaleString()}`,
        `fps: ${Math.round(fps)}`,
      ].join('<br>');
    }

    let prev = performance.now();
    function frame(now) {
      const dt = Math.min(34, now - prev);
      fps = 1000 / dt;
      prev = now;
      step(dt);
      requestAnimationFrame(frame);
    }

    window.addEventListener('pointermove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });

    window.addEventListener('pointerleave', () => {
      mouse.active = false;
    });

    window.addEventListener('click', () => {
      mouse.burst = Math.min(7, mouse.burst + 2.5);
      for (let i = 0; i < 120; i++) {
        trails.push({
          x: mouse.x + (Math.random() - 0.5) * 45,
          y: mouse.y + (Math.random() - 0.5) * 45,
          life: 10 + Math.random() * 22,
          hue: 180 + Math.random() * 120,
          size: 1 + Math.random() * 2.2,
        });
      }
    });

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
